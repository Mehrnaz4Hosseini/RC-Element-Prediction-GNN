# Base configuration for RC element prediction
project:
  name: "rc-element-prediction"
  seed: 42

data:
  # Data paths (Relative to project root)
  train_dir: "data/train"
  test_dir: "data/test"
  
  # Note: The code now uses fuzzy matching (glob) to handle variable names
  # like "Edge-ali hoseini.xlsx" or "Feature-barati_english.xlsx"
  file_patterns:
    edge_prefix: "Edge"
    feature_suffix: "*english.xlsx" # Ensures we get the english version
    label_prefix: "Label"
  
  # Node types based on Ele_Type column
  node_types: 
    column: 0
    beam: 1
  
  # Column configurations
  columns:
    # Feature file columns
    element_name: "Name"       # Changed from Element_Name
    element_type: "Ele_Type"   # Binary: 0=column, 1=beam
    source_node: "Source"      # Edge file
    target_node: "Target"      # Edge file
    
    # Label file columns
    label_width: "Width"       # Changed from Width (b)
    label_height: "Height"     # Changed from Height (h)

  # Feature columns to use
  feature_columns:
    - "Structural_System"
    - "Opening_Status"
    - "Height_Difference"
    - "Roof_Area_Difference_Excluding_Roof"
    - "Relative_to_Horizontal_Axis"
    - "Relative_to_Vertical_Axis"
    - "Beam_Arrangement"
    - "Width_to_Length_Ratio"
    - "Number_of_Horizontal_Frames"
    - "Number_of_Vertical_Frames"
    - "Frame_Ratio_X_to_Y"
    - "Structure_Height"
    - "Number_of_Floors"
    - "Earthquake_Coefficient"
    - "Allowable_Drift"
    - "Beam_Concrete_Compressive_Strength"
    - "Column_Concrete_Compressive_Strength"
    - "Dynamic_Analysis"
    - "Static_Analysis"
    - "X1"
    - "Y1"
    - "Z1"
    - "X2"
    - "Y2"
    - "Z2"
    - "Length"
    - "Angle"
    - "Story"
    - "Boundary"
    - "Alignment"
    - "GravityForce"
    - "EX"
    - "EY"
    - "CMX"
    - "CRX"
    - "DeltaX"
    - "CMY"
    - "CRY"
    - "DeltaY"
    - "CRXi"
    - "CRYi"

training:
  epochs: 100
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 20
  
  # Target columns (Mapped to updated labels)
  target_columns: ["Width", "Height"]