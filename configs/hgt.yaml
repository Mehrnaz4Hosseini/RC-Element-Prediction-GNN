model:
  dropout: 0.3
  hidden_channels: 128
  node_types:
  - beam
  - column
  num_heads: 4
  num_layers: 3
  output_dim: 2
  type: hgt
  use_structural_encoding: true
paths:
  checkpoints: checkpoints/hgt
training:
  beam_weight: 1.0
  column_weight: 1.0
  epochs: 100
  grad_clip: 1.0
  height_weight: 1.0
  k_folds: 5
  learning_rate: 0.001
  patience: 20
  scheduler_factor: 0.5
  scheduler_patience: 10
  weight_decay: 0.0001
  width_weight: 1.0
