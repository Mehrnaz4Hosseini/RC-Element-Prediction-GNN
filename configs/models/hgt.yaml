# HGT Configuration for RC Element Prediction
model:
  type: "hgt"
  # Architecture
  hidden_channels: 128      # Hidden dimension throughout the network
  num_layers: 3             # Number of HGT layers (message passing steps)
  num_heads: 4              # Attention heads per relation type
  dropout: 0.3              # Dropout for regularization
  
  # Node types (from your graph builder)
  node_types:
    - beam
    - column
  
  # Edge types (from your graph builder - 4 relation types)
  edge_types:
    - ["beam", "to", "beam"]      # Beam-to-beam connections
    - ["column", "to", "column"]   # Column-to-column connections  
    - ["beam", "to", "column"]     # Beam loading columns
    - ["column", "to", "beam"]     # Column supporting beams
  
  # Prediction targets
  output_dim: 2             # Width (b) and Height (h)
  
  # Optional: Structural engineering inductive bias
  use_structural_encoding: true

training:
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001      # L2 regularization
  patience: 20              # Early stopping patience
  scheduler_factor: 0.5     # Reduce LR by half when plateauing
  scheduler_patience: 10    # LR scheduler patience
  
  # Loss function
  loss: "mse"               # Mean Squared Error for regression
  
  # Gradient clipping
  grad_clip: 1.0

paths:
  checkpoints: "checkpoints/hgt"
  
# Logging
logging:
  log_attention_weights: false  # Set true to analyze relationships
  log_gradients: false